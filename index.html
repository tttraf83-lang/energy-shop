<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Energy Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --gold: #d4af37;
            --bg: #1a1a1a;
            --card-bg: #222222;
            --text: #e0e0e0;
            --accent: #4caf50;
            --border: #0a0a0a;
        }

        * { margin:0; padding:0; box-sizing:border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: 70px;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: linear-gradient(180deg, #1a1a1a 85%, rgba(26,26,26,0));
            padding: 20px 16px 12px;
            text-align: center;
        }
        .header h1 {
            font-size: 26px;
            font-weight: 700;
            color: var(--gold);
            letter-spacing: 4px;
            text-transform: uppercase;
        }
        .header .line {
            width: 50px;
            height: 2px;
            background: var(--gold);
            margin: 8px auto 0;
            border-radius: 1px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 12px;
            color: var(--gold);
            font-size: 14px;
            cursor: pointer;
            margin: 0 12px 8px;
        }

        .categories-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding: 0 12px;
        }
        .category-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 0;
            border: 2px solid var(--border);
            cursor: pointer;
            transition: 0.2s;
            overflow: hidden;
            text-align: center;
        }
        .category-card:active {
            border-color: var(--gold);
        }
        .category-card img {
            width: 100%;
            aspect-ratio: 1/1;
            object-fit: cover;
            background: #1a1a1a;
        }
        .category-card .cat-name {
            padding: 12px 8px;
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
        }

        .products-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 0 12px;
        }
        .product-card {
            background: var(--card-bg);
            border-radius: 14px;
            padding: 12px;
            border: 2px solid var(--border);
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .product-card:active {
            border-color: var(--gold);
        }
        .product-image {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 10px;
            background: #1a1a1a;
            flex-shrink: 0;
        }
        .product-info {
            flex: 1;
            min-width: 0;
        }
        .product-brand {
            font-size: 11px;
            color: var(--gold);
            margin-bottom: 2px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .product-name {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .product-price {
            font-size: 16px;
            font-weight: 700;
            color: var(--accent);
        }

        .detail-view { padding: 0 12px; }
        .detail-image {
            width: 100%;
            aspect-ratio: 1/1;
            object-fit: cover;
            border-radius: 16px;
            margin-bottom: 16px;
            background: #1a1a1a;
        }
        .detail-brand {
            font-size: 13px;
            color: var(--gold);
            margin-bottom: 4px;
            letter-spacing: 1px;
        }
        .detail-name {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .detail-price {
            font-size: 24px;
            font-weight: 800;
            color: var(--accent);
            margin-bottom: 16px;
        }

        .version-switch {
            display: flex;
            gap: 6px;
            margin-bottom: 16px;
        }
        .version-btn {
            flex: 1;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #2a2a2a;
            color: #aaa;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            text-align: center;
            transition: 0.3s;
        }
        .version-btn.active {
            background: var(--gold);
            color: #000;
            border-color: var(--gold);
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-bottom: 16px;
        }
        .option-btn {
            padding: 10px 4px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #2a2a2a;
            color: #aaa;
            font-size: 11px;
            cursor: pointer;
            text-align: center;
            transition: 0.3s;
            word-break: break-word;
        }
        .option-btn.selected {
            background: var(--gold);
            color: #000;
            border-color: var(--gold);
            font-weight: 600;
        }

        .add-btn {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background: #2a2a2a;
            color: #666;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        .add-btn.active {
            background: var(--gold);
            color: #000;
        }

        .cart-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #1a1a1a;
            border-top: 2px solid var(--border);
            padding: 10px 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 100;
        }
        .cart-info {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }
        .cart-count {
            background: var(--gold);
            color: #000;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
        }
        .cart-total {
            font-weight: 600;
            font-size: 15px;
        }
        .checkout-btn {
            padding: 10px 20px;
            border-radius: 12px;
            border: none;
            background: var(--gold);
            color: #000;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
        }

        .modal-overlay {
            position: fixed;
            top:0; left:0; right:0; bottom:0;
            background: rgba(0,0,0,0.85);
            z-index:200;
            display:flex;
            align-items:center;
            justify-content:center;
            padding: 16px;
        }
        .modal {
            background:#222222;
            border-radius:20px;
            width:100%;
            max-width:400px;
            max-height:80vh;
            overflow-y:auto;
            padding:24px 16px;
            border:2px solid var(--border);
        }
        .modal h2 {
            text-align:center;
            color:var(--gold);
            margin-bottom:20px;
            font-size:20px;
        }
        .modal-item {
            display:flex;
            justify-content:space-between;
            padding:10px 0;
            border-bottom:1px solid #333;
            font-size:13px;
            align-items:center;
        }
        .remove-btn {
            background: #c0392b;
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 11px;
            cursor: pointer;
            margin-right: 8px;
            flex-shrink: 0;
        }

        .delivery-option {
            padding: 14px;
            border-radius: 14px;
            border: 2px solid var(--border);
            background: #2a2a2a;
            cursor: pointer;
            text-align: center;
            margin-bottom: 10px;
            transition: 0.3s;
        }
        .delivery-option.selected {
            border-color: var(--gold);
            background: #2a2510;
        }
        .delivery-option .title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 2px;
        }
        .delivery-option .price {
            font-size: 13px;
            color: var(--accent);
        }
        .delivery-option .address {
            font-size: 12px;
            color: #888;
        }

        .input-group {
            margin-bottom: 12px;
        }
        .input-group label {
            display: block;
            font-size: 12px;
            color: #888;
            margin-bottom: 4px;
            font-weight: 500;
        }
        .input-group input,
        .input-group select {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #2a2a2a;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }
        .input-group input:focus,
        .input-group select:focus {
            border-color: var(--gold);
        }

        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 8px;
        }
        .btn-gold { background: var(--gold); color: #000; }
        .btn-green { background: var(--accent); color: #000; }
        .btn-outline { background: transparent; color: #c0392b; border: 1px solid #c0392b; }
        .btn-close { background: #2a2a2a; color: #999; }
        .btn:disabled { opacity: 0.4; pointer-events: none; }

        .total-row {
            display:flex;
            justify-content:space-between;
            padding:12px 0;
            font-size:16px;
            font-weight:700;
            border-top:1px solid #333;
            margin-top:8px;
        }
        .total-row .price { color: var(--accent); }

        .thank-you {
            text-align:center;
            padding:20px 0;
        }
        .thank-you .icon { font-size:50px; margin-bottom:16px; }
        .thank-you .msg { font-size:16px; color:#ccc; line-height:1.6; }
        .thank-you .shop-name {
            color: var(--gold);
            font-size: 18px;
            font-weight: 700;
            margin-top: 12px;
            letter-spacing: 2px;
        }

        .hidden { display:none !important; }
        input.required:invalid { border-color: #c0392b; }

        .user-info-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            background: #2a2a2a;
            border-radius: 10px;
            border: 1px solid var(--border);
            margin-bottom: 16px;
            font-size: 13px;
        }
        .user-info-badge .user-icon {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--gold);
            color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Energy Shop</h1>
        <div class="line"></div>
    </div>

    <div id="categoriesView">
        <div class="categories-grid" id="categoriesGrid"></div>
    </div>

    <div id="productsView" class="hidden">
        <div class="back-btn" onclick="goToCategories()">← Назад</div>
        <div class="products-grid" id="productsGrid"></div>
    </div>

    <div class="detail-view hidden" id="detailView"></div>

    <div class="cart-bar">
        <div class="cart-info" onclick="showCartModal()">
            <span style="font-size:22px;">🛒</span>
            <span class="cart-count" id="cartCount">0</span>
            <span class="cart-total" id="cartTotal">0 ₽</span>
        </div>
        <button class="checkout-btn" id="checkoutBtn">Оформить</button>
    </div>

    <!-- Корзина -->
    <div class="modal-overlay hidden" id="cartModal">
        <div class="modal">
            <h2>Корзина</h2>
            <div id="cartItems"></div>
            <div id="cartSummary"></div>
            <button class="btn btn-outline" id="clearCartBtn">Очистить</button>
            <button class="btn btn-gold" id="continueBtn">Продолжить</button>
            <button class="btn btn-close" id="closeCartBtn">Закрыть</button>
        </div>
    </div>

    <!-- Доставка -->
    <div class="modal-overlay hidden" id="deliveryModal">
        <div class="modal">
            <h2>Способ получения</h2>
            <div class="delivery-option" id="deliveryOption" onclick="selectDelivery('delivery')">
                <div class="title">🚗 Доставка</div>
                <div class="price">+250 ₽</div>
            </div>
            <div class="delivery-option" id="pickupOption" onclick="selectDelivery('pickup')">
                <div class="title">🏪 Самовывоз</div>
                <div class="address">м. Сокольническая</div>
            </div>
            <div id="deliveryFields" class="hidden">
                <div class="input-group">
                    <label>Метро</label>
                    <input type="text" id="metroInput" placeholder="Введите станцию метро" class="required">
                </div>
                <div class="input-group">
                    <label>Дата доставки</label>
                    <input type="date" id="dateInput" class="required">
                </div>
                <div class="input-group">
                    <label>Время доставки</label>
                    <select id="timeInput" class="required">
                        <option value="">Выберите время</option>
                    </select>
                </div>
            </div>
            <div id="pickupInfo" class="hidden" style="text-align:center;padding:16px;color:#888;">
                📍 м. Сокольническая
            </div>
            <button class="btn btn-gold" id="confirmDeliveryBtn" disabled>Подтвердить</button>
            <button class="btn btn-close" id="backToCartBtn">← Назад</button>
        </div>
    </div>

    <!-- Подтверждение -->
    <div class="modal-overlay hidden" id="confirmModal">
        <div class="modal">
            <h2>Проверьте заказ</h2>
            <div class="user-info-badge" id="confirmUserInfo"></div>
            <div id="confirmItems"></div>
            <div id="confirmDelivery"></div>
            <div class="total-row">
                <span>Итого</span>
                <span class="price" id="confirmTotal"></span>
            </div>
            <button class="btn btn-green" id="finalConfirmBtn">✅ Всё верно</button>
            <button class="btn btn-close" id="backToDeliveryBtn">← Назад</button>
        </div>
    </div>

    <!-- Спасибо -->
    <div class="modal-overlay hidden" id="thanksModal">
        <div class="modal">
            <div class="thank-you">
                <div class="icon">🙏</div>
                <div class="msg">
                    Спасибо за заказ!<br><br>
                    Скоро с Вами свяжется менеджер.
                </div>
                <div class="shop-name">Energy Shop</div>
            </div>
            <button class="btn btn-gold" id="closeThanksBtn">Закрыть</button>
        </div>
    </div>

        function openCategory(catId) {
            currentCategory = catId;

            currentView = 'products';
            renderProducts();
        }

            currentCategory = null;
            renderCategories();
        }

        function renderProducts() {
            const filtered = products.filter(p => p.category === currentCategory);
            document.getElementById('productsGrid').innerHTML = filtered.map(p => `
                <div class="product-card" onclick="openDetail('${p.id}')">
                    <img class="product-image" src="${p.image}" alt="${p.name}" onerror="this.src='data:image/svg+xml,${encodeURIComponent('<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22><rect width=%22200%22 height=%22200%22 fill=%22%23111%22/><text x=%22100%22 y=%22110%22 text-anchor=%22middle%22 fill=%22%23d4af37%22 font-size=%2220%22 font-family=%22Arial%22>' + p.name + '</text></svg>')}'" />
                    <div class="product-info">
                        <div class="product-brand">${p.brand}</div>
                        <div class="product-name">${p.name}</div>
                        <div class="product-price">${p.price.toLocaleString()} ₽</div>
                    </div>
                </div>
            `).join('');
        }

        function openDetail(pid) {
            const p = products.find(x => x.id === pid);
            if (!p) return;
            currentProductId = pid;
            currentVersion = p.hasVersions ? Object.keys(p.versions)[0] : null;
            document.getElementById('productsView').classList.add('hidden');
            document.getElementById('detailView').classList.remove('hidden');
            currentView = 'detail';
            renderDetail();
        }

        function getCurrentPrice() {
            const p = products.find(x => x.id === currentProductId);
            if (p && p.hasVersions && currentVersion) return p.versions[currentVersion].price || p.price;
            return p ? p.price : 0;
        }

        function getCurrentOptions() {
            const p = products.find(x => x.id === currentProductId);
            if (p && p.hasVersions && currentVersion) return p.versions[currentVersion].options;
            return p ? p.options : [];
        }

        function renderDetail() {
            const p = products.find(x => x.id === currentProductId);
            if (!p) return;
            const opts = getCurrentOptions();
            const price = getCurrentPrice();
            const label = p.optionLabel || 'Вкус';
            document.getElementById('detailView').innerHTML = `
                <div class="back-btn" onclick="goBackToProducts()">← Назад</div>
                <img class="detail-image" src="${p.image}" onerror="this.src='data:image/svg+xml,${encodeURIComponent('<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22400%22 height=%22400%22><rect width=%22400%22 height=%22400%22 fill=%22%23111%22/><text x=%22200%22 y=%22220%22 text-anchor=%22middle%22 fill=%22%23d4af37%22 font-size=%2230%22 font-family=%22Arial%22>' + p.name + '</text></svg>')}'" />
                <div class="detail-brand">${p.brand}</div>
                <div class="detail-name">${p.name}</div>
                <div class="detail-price">${price.toLocaleString()} ₽</div>
                ${p.hasVersions ? `<div class="version-switch">${Object.keys(p.versions).map(v => `<button class="version-btn ${v===currentVersion?'active':''}" onclick="switchVersion('${v}')">${v}</button>`).join('')}</div>` : ''}
                <div style="font-size:12px;color:#888;margin-bottom:8px;">Выберите ${label.toLowerCase()}:</div>
                <div class="options-grid">${opts.map(o => `<button class="option-btn ${cart.some(i=>i.productId===p.id&&(!p.hasVersions||i.version===currentVersion)&&i.option===o)?'selected':''}" onclick="toggleCartItem('${o.replace(/'/g,"\\'")}')">${o}</button>`).join('')}</div>
                <button class="add-btn active" onclick="goBackToProducts()">Готово</button>
            `;
        }

        function switchVersion(v) { currentVersion = v; renderDetail(); }

        function toggleCartItem(opt) {
            const p = products.find(x => x.id === currentProductId);
            const price = getCurrentPrice();
            const idx = cart.findIndex(i => i.productId===p.id && (!p.hasVersions||i.version===currentVersion) && i.option===opt);
            if (idx > -1) { cart.splice(idx,1); tg.HapticFeedback.impactOccurred('light'); }
            else { cart.push({productId:p.id,name:p.name,brand:p.brand,price,option:opt,version:p.hasVersions?currentVersion:null}); tg.HapticFeedback.impactOccurred('medium'); }
            updateCart();
            renderDetail();
        }

        function goBackToProducts() {
            document.getElementById('detailView').classList.add('hidden');
            document.getElementById('productsView').classList.remove('hidden');
            currentView = 'products';
            renderProducts();
        }

        function updateCart() {
            const cnt = cart.length;
            const total = cart.reduce((s,i) => s+i.price, 0);
            document.getElementById('cartCount').textContent = cnt || '0';
            document.getElementById('cartTotal').textContent = total.toLocaleString() + ' ₽';
        }

        function showCartModal() {
            renderCartItems();
            document.getElementById('cartModal').classList.remove('hidden');
        }

        function renderCartItems() {
            const container = document.getElementById('cartItems');
            const summary = document.getElementById('cartSummary');
            if (cart.length === 0) {
                container.innerHTML = '<p style="text-align:center;color:#555;padding:20px;">Корзина пуста</p>';
                summary.innerHTML = '';
            } else {
                const total = cart.reduce((s,i) => s+i.price, 0);
                container.innerHTML = cart.map((item, i) => `
                    <div class="modal-item">
                        <span><button class="remove-btn" onclick="removeCartItem(${i})">✕</button>${item.brand} ${item.name} ${item.version?'('+item.version+')':''} — <span style="color:#d4af37;">${item.option}</span></span>
                        <span>${item.price.toLocaleString()} ₽</span>
                    </div>
                `).join('');
                summary.innerHTML = `<div class="total-row"><span>Товаров: ${cart.length}</span><span class="price">${total.toLocaleString()} ₽</span></div>`;
            }
        }

        function removeCartItem(i) { cart.splice(i,1); updateCart(); renderCartItems(); if (cart.length===0) document.getElementById('cartModal').classList.add('hidden'); }
        function clearCart() { cart = []; updateCart(); renderCartItems(); }

        function selectDelivery(method) {
            deliveryMethod = method;
            document.querySelectorAll('.delivery-option').forEach(el => el.classList.remove('selected'));
            document.getElementById(method === 'delivery' ? 'deliveryOption' : 'pickupOption').classList.add('selected');
            const fields = document.getElementById('deliveryFields');
            const info = document.getElementById('pickupInfo');
            const btn = document.getElementById('confirmDeliveryBtn');
            if (method === 'delivery') {
                fields.classList.remove('hidden'); info.classList.add('hidden'); checkDeliveryFields();
            } else {
                fields.classList.add('hidden'); info.classList.remove('hidden'); btn.disabled = false;
            }
        }

        function checkDeliveryFields() {
            const metro = document.getElementById('metroInput').value.trim();
            const date = document.getElementById('dateInput').value;

            document.getElementById('confirmDeliveryBtn').disabled = !(metro && date && time);

            deliveryMethod = null;
            document.querySelectorAll('.delivery-option').forEach(el => el.classList.remove('selected'));

                deliveryData = { method: 'Самовывоз', cost: 0, metro: 'Сокольническая', date: '', time: '' };
            }
            const subtotal = cart.reduce((s,i) => s+i.price, 0);
            const total = subtotal + deliveryData.cost;

            document.getElementById('confirmUserInfo').innerHTML = `
                <div class="user-icon">${userInitial}</div>
                <span>Заказчик: <strong>${userDisplayName}</strong></span>
            `;

            document.getElementById('confirmItems').innerHTML = cart.map(i => `
                <div class="modal-item">
                    <span>${i.brand} ${i.name} ${i.version?'('+i.version+')':''} — ${i.option}</span>
                    <span>${i.price.toLocaleString()} ₽</span>
                </div>
            `).join('');

            document.getElementById('confirmDelivery').innerHTML = `
                <div class="modal-item"><span>${deliveryData.method}</span><span>${deliveryData.cost > 0 ? '+' + deliveryData.cost.toLocaleString() + ' ₽' : 'Бесплатно'}</span></div>
                ${deliveryData.method === 'Доставка' ? `
                    <div class="modal-item"><span>📍 Метро:</span><span>${deliveryData.metro}</span></div>
                    <div class="modal-item"><span>📅 Дата:</span><span>${deliveryData.date}</span></div>
                    <div class="modal-item"><span>⏰ Время:</span><span>${deliveryData.time}</span></div>
                ` : `<div class="modal-item"><span>📍 Адрес:</span><span>м. Сокольническая</span></div>`}
            `;
            document.getElementById('confirmTotal').textContent = total.toLocaleString() + ' ₽';
            document.getElementById('confirmModal').classList.remove('hidden');
        }

        async function sendToTelegram() {
            const subtotal = cart.reduce((s,i) => s+i.price, 0);
            const total = subtotal + deliveryData.cost;

            const orderText = `🛒 *НОВЫЙ ЗАКАЗ*

👤 *Клиент:* ${userFullName}
${userUsername ? '📱 @' + userUsername : '🆔 ID: ' + userId}
${userUsername ? '🔗 Ссылка: https://t.me/' + userUsername : '🔗 Ссылка: tg://user?id=' + userId}

📦 *Товары:*
${cart.map(i => `• ${i.brand} ${i.name} ${i.version?'('+i.version+')':''} — ${i.option} — ${i.price}₽`).join('\n')}

🚚 *Доставка:* ${deliveryData.method}
${deliveryData.method === 'Доставка' ? `
📍 Метро: ${deliveryData.metro}
📅 Дата: ${deliveryData.date}
⏰ Время: ${deliveryData.time}
💰 Стоимость доставки: +${deliveryData.cost}₽` : `
📍 Адрес: м. Сокольническая
💰 Стоимость доставки: Бесплатно`}

💰 *Сумма заказа:* ${subtotal}₽
💰 *Доставка:* ${deliveryData.cost}₽
💰 *ИТОГО:* ${total}₽`.trim();

            for (const chatId of MANAGER_CHAT_IDS) {
                try {
                    const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            chat_id: chatId,
                            text: orderText,
                            parse_mode: 'Markdown'
                        })
                    });
                    const data = await response.json();
                    if (!data.ok) console.error(`Ошибка отправки для ${chatId}:`, data.description);
                } catch (e) {
                    console.error(`Ошибка сети для ${chatId}:`, e);
                }
            }
        }

        async function finalizeOrder() {
            document.getElementById('confirmModal').classList.add('hidden');
            await sendToTelegram();
            document.getElementById('thanksModal').classList.remove('hidden');
            cart = [];
            updateCart();
        }

        document.getElementById('checkoutBtn').addEventListener('click', () => {
            if (!cart.length) return;
            tg.HapticFeedback.notificationOccurred('success');
            showCartModal();
        });

        document.getElementById('closeCartBtn').addEventListener('click', () => document.getElementById('cartModal').classList.add('hidden'));
        document.getElementById('clearCartBtn').addEventListener('click', clearCart);
        document.getElementById('continueBtn').addEventListener('click', () => { if (cart.length) showDeliveryModal(); });
        document.getElementById('backToCartBtn').addEventListener('click', () => {
            document.getElementById('deliveryModal').classList.add('hidden');
            showCartModal();
        });
        document.getElementById('confirmDeliveryBtn').addEventListener('click', showConfirmModal);
        document.getElementById('backToDeliveryBtn').addEventListener('click', () => {
            document.getElementById('confirmModal').classList.add('hidden');
            document.getElementById('deliveryModal').classList.remove('hidden');
        });
        document.getElementById('finalConfirmBtn').addEventListener('click', finalizeOrder);
        document.getElementById('closeThanksBtn').addEventListener('click', () => {
            document.getElementById('thanksModal').classList.add('hidden');
            renderCategories();
        });

        document.querySelectorAll('.modal-overlay').forEach(overlay => {
            overlay.addEventListener('click', e => { if (e.target === overlay) overlay.classList.add('hidden'); });
        });

        document.getElementById('metroInput').addEventListener('input', checkDeliveryFields);
        document.getElementById('dateInput').addEventListener('change', checkDeliveryFields);
        document.getElementById('timeInput').addEventListener('change', checkDeliveryFields);

        renderCategories();
        updateCart();
    </script>
</body>
</html>
